<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacker News</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <header class="site-header">
    <nav class="nav-inner" aria-label="Primary">
      <a target="_blank" rel="noopener noreferrer" href="index.html" class="wordmark">Hacker News</a>
      <div class="nav-links">
        <a target="_blank" rel="noopener noreferrer" href="index.html" id="nav-new" aria-current="page">new</a>
        <span class="nav-sep">·</span>
        <a target="_blank" rel="noopener noreferrer" href="past.html" id="nav-past">past</a>
        <span class="nav-sep">·</span>
        <a target="_blank" rel="noopener noreferrer" href="comments.html" id="nav-comments">comments</a>
        <span class="nav-sep">·</span>
        <a target="_blank" rel="noopener noreferrer" href="ask.html" id="nav-ask">ask</a>
        <span class="nav-sep">·</span>
        <a target="_blank" rel="noopener noreferrer" href="show.html" id="nav-show">show</a>
        <span class="nav-sep">·</span>
        <a target="_blank" rel="noopener noreferrer" href="jobs.html" id="nav-jobs">jobs</a>
      </div>
      <div class="nav-actions">
        <a target="_blank" rel="noopener noreferrer" href="submit.html" class="btn btn-primary" id="btn-post">Post it</a>
        <a target="_blank" rel="noopener noreferrer" href="login.html" class="btn btn-ghost" id="btn-signin" aria-current="page">Sign in</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <div class="form-page glass-strong" style="margin: 20px auto; padding: var(--space-lg); border-radius: var(--radius-lg); border: 1.5px solid var(--glass-border-accent); max-width: 420px;">
      <h1 style="font-family: var(--font-display); font-weight: 700; margin-bottom: var(--space-md); color: var(--accent-primary);">Sign in</h1>
      <form action="#" method="post" style="display:flex; flex-direction:column; gap: var(--space-md);">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: var(--space-sm);">Login</button>
      </form>
      <div class="form-or">or</div>
      <h2 style="font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); margin-bottom: var(--space-sm);">Create Account</h2>
      <form action="#" method="post" style="display:flex; flex-direction:column; gap: var(--space-md);">
        <div class="form-group">
          <label for="new-username">Username</label>
          <input type="text" id="new-username" name="username" required autocomplete="new-username">
        </div>
        <div class="form-group">
          <label for="new-password">Password</label>
          <input type="password" id="new-password" name="password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-ghost" style="margin-top: var(--space-sm);">Create Account</button>
      </form>
    </div>
    <footer class="site-footer">
      <div class="footer-links">
        <a target="_blank" rel="noopener noreferrer" href="#">Guidelines</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="#">FAQ</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="#">Lists</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="https://github.com/HackerNews/API">API</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="#">Security</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="https://www.ycombinator.com/legal/">Legal</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="https://www.ycombinator.com/apply/">Apply to YC</a>
        <span class="footer-sep">|</span>
        <a target="_blank" rel="noopener noreferrer" href="mailto:hn@ycombinator.com">Contact</a>
      </div>
      <div class="footer-search">
        <label for="search">Search:</label>
        <input type="text" id="search" name="q" aria-label="Search">
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      gsap.registerPlugin(ScrollTrigger);
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
